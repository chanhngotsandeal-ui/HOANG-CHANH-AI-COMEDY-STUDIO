    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && (event.reason ? (event.reason.message || String(event.reason)) : '');
        if (reason && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('vite:ws') !== -1)) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(event) {
        var msg = event && (event.message || '');
        if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1)) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
